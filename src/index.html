<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Alex Morgan — Full-stack developer</title>
  <base href="/" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <meta content="Alex Morgan — full-stack developer turning ideas into digital experiences." name="description" />
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap"
    rel="stylesheet"
  />
  <script>
    var root = document.documentElement;
    try {
      root.dataset.theme =
        localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      root.dataset.motion =
        localStorage.getItem('motion') || (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'on');
    } catch (e) {
      root.dataset.theme = 'dark';
      root.dataset.motion = 'on';
    }
  </script>
</head>
<body>
<app-root></app-root>
</body>
</html>
