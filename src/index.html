<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Alex Morgan — Full-stack developer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Alex Morgan — full-stack developer turning ideas into digital experiences." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap"
    />
    <script>
      // apply the saved theme and motion setting before first paint (no flash)
      var root = document.documentElement;
      try {
        root.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
        root.dataset.motion =
          localStorage.getItem('motion') || (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'on');
      } catch (e) {
        root.dataset.theme = 'dark';
        root.dataset.motion = 'on';
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
